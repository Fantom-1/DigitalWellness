name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'frontend/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "❌ CLOUDFLARE_API_TOKEN secret is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "❌ CLOUDFLARE_ACCOUNT_ID secret is not set!"
            exit 1
          fi
          echo "✅ Secrets are present"

      - name: Install root dependencies
        run: npm clean-install

      - name: Install frontend dependencies
        run: npm --prefix frontend clean-install

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Copy dist to root (for wrangler.jsonc assets directory)
        run: cp -r frontend/dist ./dist

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: '.'
          wranglerVersion: '4'

